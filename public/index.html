<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة قطاع غزة التفاعلية — توضيح الخط الأصفر وحركة الكاميرا</title>
  <style>
    @font-face {
      font-family: "Cairo";
      src: url("/fonts/Cairo.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #060a10;
      color: #f0f6fc;
      font-family: "Cairo", "DejaVu Sans", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    body.render-mode {
      overflow: hidden;
      background: #000;
    }
    body.render-mode .ui-chrome {
      display: none !important;
    }
    body.render-mode .stage-wrap {
      padding: 0;
      width: 1920px;
      height: 1080px;
      max-width: none;
    }
    body.render-mode #mapCanvas {
      width: 1920px !important;
      height: 1080px !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    .top-bar {
      background: linear-gradient(90deg, rgba(10,17,26,0.96), rgba(16,26,38,0.96));
      border-bottom: 1px solid rgba(255, 214, 0, 0.28);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffd600;
      box-shadow: 0 0 14px #ffd600;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.2px;
    }
    .brand span {
      font-size: 0.85rem;
      color: #ffd600;
      background: rgba(255, 214, 0, 0.12);
      border: 1px solid rgba(255, 214, 0, 0.35);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stage-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 18px 6px;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 190px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mapCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid rgba(255, 214, 0, 0.3);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      cursor: grab;
      background: #050a12;
    }
    #mapCanvas:active {
      cursor: grabbing;
    }

    .controls-panel {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 8px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(13, 21, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
    }
    .scrubber {
      flex: 1;
      accent-color: #ffd600;
      height: 6px;
      cursor: pointer;
    }
    .time-readout {
      font-family: monospace;
      font-size: 0.9rem;
      color: #ffd600;
      min-width: 105px;
      text-align: center;
      direction: ltr;
    }

    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(13, 21, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 9px 14px;
      border-radius: 10px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-group-label {
      font-size: 0.8rem;
      color: #93a8be;
      margin-left: 6px;
      font-weight: 700;
    }
    button, .btn-link {
      background: rgba(28, 42, 62, 0.9);
      color: #e6f0fa;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 12px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, .btn-link:hover {
      background: rgba(45, 66, 95, 0.95);
      border-color: #ffd600;
      color: #fff;
    }
    button.primary {
      background: linear-gradient(135deg, #ffd600, #ff9800);
      color: #090d14;
      border-color: #ffd600;
      font-weight: 800;
    }
    button.primary:hover {
      filter: brightness(1.08);
    }
    button.active {
      background: rgba(255, 214, 0, 0.18);
      border-color: #ffd600;
      color: #ffd600;
    }
    .btn-link.download {
      background: rgba(0, 200, 130, 0.18);
      border-color: rgba(0, 230, 150, 0.5);
      color: #4df7b0;
    }
  </style>
</head>
<body>
  <header class="top-bar ui-chrome">
    <div class="brand">
      <div class="brand-dot"></div>
      <h1>تحريك خريطة قطاع غزة — توضيح الخط الأصفر (Yellow Line)</h1>
      <span>45 كم • 53% شرق الخط / 47% غرب الخط</span>
    </div>
    <div class="top-actions">
      <button id="btnToggleYellow" class="active" title="إظهار/إخفاء الخط الأصفر والكتل الخرسانية">الخط الأصفر والكتل الخرسانية ✓</button>
      <button id="btnToggleZones" class="active" title="إظهار/إخفاء تظليل مناطق السيطرة">تظليل مناطق السيطرة (53% / 47%) ✓</button>
      <button id="btnToggleExpanded" class="active" title="إظهار/إخفاء خط التوسع الغربي البرتقالي">خط التوسع الغربي (58%) ✓</button>
      <button id="btnToggleLabels" class="active" title="إظهار/إخفاء التسميات الميدانية">التسميات الميدانية ✓</button>
      <a href="/gaza_yellow_line_animation.mp4" download="gaza_yellow_line_animation.mp4" class="btn-link download">⬇ تحميل الفيديو (MP4 Full HD)</a>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="canvas-container">
      <canvas id="mapCanvas" width="1920" height="1080"></canvas>
    </div>
  </main>

  <section class="controls-panel ui-chrome">
    <div class="timeline-row">
      <button id="btnPlayPause" class="primary">⏸ إيقاف مؤقت</button>
      <button id="btnRestart">↺ إعادة من البداية</button>
      <input type="range" id="timelineSlider" class="scrubber" min="0" max="24" step="0.03" value="0" />
      <div class="time-readout" id="timeReadout">00.0s / 24.0s</div>
    </div>

    <div class="buttons-row">
      <div class="btn-group">
        <span class="btn-group-label">حركة الكاميرا (Zoom):</span>
        <button id="btnZoomIn">＋ زووم إن (Zoom In)</button>
        <button id="btnZoomOut">－ زووم آوت (Zoom Out)</button>
        <button id="btnResetCam">⌖ إعادة ضبط الكاميرا</button>
      </div>

      <div class="btn-group">
        <span class="btn-group-label">انتقال الكاميرا السريع للمحافظات:</span>
        <button class="scene-btn active" data-scene="0">1. نظرة شاملة للقطاع</button>
        <button class="scene-btn" data-scene="1">2. زووم إن: الشمال ومدينة غزة</button>
        <button class="scene-btn" data-scene="2">3. تتبع: المحافظة الوسطى</button>
        <button class="scene-btn" data-scene="3">4. تتبع: خانيونس وشرقها</button>
        <button class="scene-btn" data-scene="4">5. زووم إن: رفح ومعبر رفح</button>
        <button class="scene-btn" data-scene="5">6. زووم آوت: مقارنة المساحات (53% / 47%)</button>
      </div>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
